<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Ganaste! - Reclama tu premio</title>
    <link rel="stylesheet" href="../estilo/nuevoEstilo.css">
    <style>
        .form-focus-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="prize-card">
            <div class="prize-header">
                <span class="badge">🎉 ¡FELICIDADES! 🎉</span>
                <h1>¡GANASTE!</h1>
                <p class="subtitle">Completa el formulario para reclamar tu premio</p>
            </div>
            
            <form class="prize-form" id="prizeForm">
                <div class="form-group">
                    <label for="name">Nombre Completo *</label>
                    <input type="text" id="name" name="name" required placeholder="Tu nombre completo">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+54 9 XXXX XXXXXX">
                </div>

                <div class="form-group">
                    <label for="document">Documento de Identidad *</label>
                    <input type="text" id="document" name="document" required placeholder="DNI/Cédula">
                </div>

                <div class="form-group">
                    <label for="address">Dirección *</label>
                    <input type="text" id="address" name="address" required placeholder="Tu dirección completa">
                </div>

                <div class="form-group">
                    <label for="terms" class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        Acepto los términos y condiciones
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn neon-button">RECLAMAR PREMIO</button>
                    <button type="button" class="btn btn-secondary" onclick="goBackToWheel()">VOLVER AL INICIO</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/popup.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('prizeForm');

            // Randomly show popups while the user is on the page
            window.startAggressivePopups(2000, 5, 0.6);

            // Form submission shows the message
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Enviar al usuario a los términos y condiciones interminables
                window.location.href = "terminos.html";
            });
        });

        function goBackToWheel() {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
